<!doctype html>
<html lang="en">
  <head>
    <script>
      // Gracefully silence expected HMR WebSocket disconnection notifications in cloud iframe environment
      (function() {
        var originalConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var isBenign = args.some(function(arg) {
            if (!arg) return false;
            var text = typeof arg === 'string' ? arg : (arg.message || String(arg));
            return (
              text.indexOf('WebSocket closed without opened') !== -1 ||
              (text.indexOf('[vite]') !== -1 && text.indexOf('WebSocket') !== -1)
            );
          });
          if (isBenign) {
            return;
          }
          return originalConsoleError.apply(console, args);
        };

        window.addEventListener('error', function (e) {
          if (
            e &&
            ((e.message && e.message.indexOf('WebSocket closed without opened') !== -1) ||
             (e.error && e.error.message && e.error.message.indexOf('WebSocket closed without opened') !== -1))
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          if (
            e &&
            ((e.reason && e.reason.message && e.reason.message.indexOf('WebSocket closed without opened') !== -1) ||
             (typeof e.reason === 'string' && e.reason.indexOf('WebSocket closed without opened') !== -1))
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
